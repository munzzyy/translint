name: translint
description: Catch broken translations before they ship - missing keys, placeholder mismatches, empty and untranslated values.
author: Cole Munz
branding:
  icon: globe
  color: gray-dark

inputs:
  paths:
    description: Directory of locale files, or specific files, space-separated (e.g. "locales/" or "locales/en.json locales/de.json").
    required: true
  base:
    description: Locale name (filename stem) to treat as the reference.
    required: false
    default: "en"
  strict:
    description: Also fail on extra keys and untranslated-value heuristic hits, not just missing keys/placeholder mismatches/empty values.
    required: false
    default: "false"
  format:
    description: Force a format (json/po/properties) instead of detecting from extension.
    required: false
    default: ""
  recursive:
    description: Scan subdirectories too, not just the files directly inside the directory.
    required: false
    default: "false"
  locale-from:
    description: Where the locale name comes from - "stem" (en.json, the default) or "dir" (en/common.json, the next-i18next layout - use with recursive).
    required: false
    default: "stem"
  python-version:
    description: Python version to run translint with.
    required: false
    default: "3.x"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      env:
        TL_PATHS: ${{ inputs.paths }}
        TL_BASE: ${{ inputs.base }}
        TL_STRICT: ${{ inputs.strict }}
        TL_FORMAT: ${{ inputs.format }}
        TL_RECURSIVE: ${{ inputs.recursive }}
        TL_LOCALE_FROM: ${{ inputs.locale-from }}
        TL_SCRIPT: ${{ github.action_path }}/translint.py
      run: |
        set -e
        args=(--base "$TL_BASE")
        if [ "$TL_STRICT" = "true" ]; then
          args+=(--strict)
        fi
        if [ -n "$TL_FORMAT" ]; then
          args+=(--format "$TL_FORMAT")
        fi
        if [ "$TL_RECURSIVE" = "true" ]; then
          args+=(--recursive)
        fi
        if [ -n "$TL_LOCALE_FROM" ]; then
          args+=(--locale-from "$TL_LOCALE_FROM")
        fi
        # $TL_PATHS stays unquoted: the input is a space-separated list.
        python "$TL_SCRIPT" "${args[@]}" $TL_PATHS
