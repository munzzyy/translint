[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "translint"
version = "0.5.0"
description = "Catch broken translations before they ship: missing keys, placeholder mismatches, empty and untranslated values."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Cole Munz" }]
keywords = ["i18n", "l10n", "localization", "linter", "translation", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]

[project.scripts]
translint = "translint:main"

[project.urls]
Homepage = "https://github.com/munzzyy/translint"
Issues = "https://github.com/munzzyy/translint/issues"

[tool.setuptools]
py-modules = ["translint"]
